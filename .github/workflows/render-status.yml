name: render-status
# Read-only: latest deploys on the Render service (status/queue visibility).
on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Service + deploys snapshot
        run: |
          BASE="https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}"
          AUTH="Authorization: Bearer ${{ secrets.RENDER_DEPLOY_TOKEN }}"
          curl -s -H "$AUTH" "$BASE" | node -e 'let b="";process.stdin.on("data",d=>b+=d).on("end",()=>{const j=JSON.parse(b);const s=j.service||j;console.log("service:",s.name,"| suspended:",s.suspended,"| autoDeploy:",s.autoDeploy)})'
          curl -s -H "$AUTH" "$BASE/deploys?limit=2" -o deps.json -w 'deploys http: %{http_code}\n'
          node -e 'const j=JSON.parse(require("fs").readFileSync("deps.json","utf8"));const arr=Array.isArray(j)?j:(j.deploys||[]);for(const it of arr){const d=it.deploy||it;console.log("deploy:",(d.id||"?").slice(0,12),"|",d.status,"|",d.createdAt,"|",String((d.commit&&d.commit.message)||"").slice(0,40))}'
          node -e 'const j=JSON.parse(require("fs").readFileSync("deps.json","utf8"));console.log("raw sample:", JSON.stringify(j).slice(0,400))'
