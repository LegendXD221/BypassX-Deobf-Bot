name: keepalive
# RETIRED as a cron: the bot now lives on the VPS under pm2 (24/7, @reboot
# resurrect). The old job pinged the Render /health URL every 10 minutes to
# keep the free-tier web service awake — Render is suspended and the VPS has
# no public HTTP port (NAT-mapped SSH only), so there is nothing to ping.
# Kept as a manual probe only (workflow_dispatch).
on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Probe /health (manual)
        run: |
          curl -fsS -m 30 "${{ secrets.KEEPALIVE_URL }}" \
            && echo "keepalive ping ok" \
            || echo "keepalive ping failed (will retry next run)"
