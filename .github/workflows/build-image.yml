name: build-image
# Builds the production Docker image and pushes it to GHCR as a backup
# deployment artifact (the live Render service is repo-based with autoDeploy).
# The image also serves any Docker host: docker run ghcr.io/legendxd221/bypassx-deobf-bot
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/legendxd221/bypassx-deobf-bot:latest
            ghcr.io/legendxd221/bypassx-deobf-bot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
