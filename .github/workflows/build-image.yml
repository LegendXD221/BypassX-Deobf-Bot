name: build-image
# Builds the production Docker image and pushes it to GHCR, then triggers a
# Render deploy of the image-based service (RENDER_SERVICE_ID +
# RENDER_DEPLOY_TOKEN repo secrets).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/legendxd221/bypassx-deobf-bot:latest
            ghcr.io/legendxd221/bypassx-deobf-bot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render deploy
        run: |
          curl -fsS -m 60 -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_DEPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "do_not_clear"}' \
            && echo "render deploy triggered" \
            || echo "render deploy trigger skipped/failed (service may not exist yet)"
