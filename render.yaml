# Render Blueprint — BypassX Deobf Bot (free-tier web service, 24/7 keep-alive)
#
# Free-tier notes:
#  - `type: web` + plan free (workers are paid; a bot runs fine as a web service
#    with the keep-alive HTTP server in src/keepalive.js)
#  - Render sleeps free services after 15 min without INBOUND traffic. Three
#    layers prevent that: /health health checks, a 9-min self-ping to PUBLIC_URL,
#    and .github/workflows/keepalive.yml pinging every 10 min.
#
# Deploy: Render → New → Blueprint → point at this repo. Secrets use sync:false
# so they are prompted in the dashboard and never stored in git.
# LIVE DEPLOYMENT: bypassx-deobf-bot.onrender.com (created via API, same shape).
# Backup container image: ghcr.io/legendxd221/bypassx-deobf-bot (built by CI).
services:
  - type: web
    name: bypassx-deobf-bot
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: node bin/prepare-engine.js && node src/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: PUBLIC_URL
        sync: false          # e.g. https://bypassx-deobf-bot.onrender.com (enables self-ping)
      - key: PASTEFY_TOKEN
        sync: false
      - key: GUILD_ID
        sync: false
      - key: DATABASE_URL
        sync: false          # Neon free-tier Postgres connection string (postgresql://…neon.tech/…?sslmode=require)
      - key: OWNER_ID
        sync: false          # bot owner user id (default baked into src/config.js)
      - key: OWNER_PIN
        sync: false          # optional 2nd protection layer for dangerous owner commands
      - key: DASHBOARD_TOKEN
        sync: false          # secret dashboard path token → /dash/<DASHBOARD_TOKEN> (long random string; unset = auto-generated, printed once in the private log)
      - key: PREFIX
        value: "."
      - key: NODE_VERSION
        value: "22"
      - key: ENGINE_URL
        value: https://github.com/LegendXD221/BypassX-Deobf-Bot/releases/latest/download/bypassx-deobf.gz
      - key: ENGINE_TIMEOUT_S
        value: "240"
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: PASTEFY_EXPIRE_DAYS
        value: "30"
